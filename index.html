<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy policies</title>
    <style>
      :root { color-scheme: light dark; --bg:#fff; --text:#16181d; --muted:#5a6068; --accent:#1f6feb; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --text:#e8eaed; --muted:#9aa1ab; --accent:#6ea8fe; } }
      body { margin:0; padding:48px 16px; background:var(--bg); color:var(--text);
             font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      main { max-width:640px; margin:0 auto; }
      h1 { font-size:1.6rem; margin:0 0 6px; }
      p { color:var(--muted); margin:0 0 24px; }
      a { color:var(--accent); }
      li { margin:8px 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Privacy policies</h1>
      <p>The privacy policies for published applications.</p>
      <ul>
        <li><a href="./secure-space/">Secure Space</a> — private vault for photos, videos, notes and passwords</li>
      </ul>
    </main>
  </body>
</html>
